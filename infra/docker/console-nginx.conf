server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — let React Router handle deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed assets, no cache for the entry HTML.
  location ~* \.(js|css|png|jpg|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Security headers — minimum baseline; tighten CSP per project.
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)";
}
