# Supabase project config. Used by `supabase start` for the local dev stack
# and by `supabase functions deploy` for edge functions.

project_id = "stigg-os"

[db]
port = 54322
shadow_port = 54320
major_version = 16

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5174",
  "http://localhost:5175",
  "http://localhost:5176",
]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# ─── Edge Functions ────────────────────────────────────────────────────────
# Each function reads ANTHROPIC_API_KEY + SUPABASE_* from the Supabase secrets
# store. Set them via:  supabase secrets set ANTHROPIC_API_KEY=sk-ant-…

[functions.incident-copilot]
verify_jwt = true

[functions.schedule-agent]
verify_jwt = true

[functions.compliance-watcher]
verify_jwt = true

[functions.forensic-search]
verify_jwt = true

[functions.sales-assessment]
verify_jwt = true

[functions.billing-run]
verify_jwt = true

[functions.invoice-pdf]
verify_jwt = true

[functions.stripe-webhook]
# Stripe signs the request itself; no Supabase JWT.
verify_jwt = false

[functions.dispatch-router]
verify_jwt = true

[functions.hikvision-events]
# Hikvision NVRs sign with their own HMAC secret on the webhook.
verify_jwt = false

[functions.vehicle-track]
# Traccar / OsmAnd shippers — auth via TRACCAR_TOKEN URL parameter.
verify_jwt = false

[functions.asset-track]
# AirTag bridges — auth via ASSET_TRACK_TOKEN URL parameter.
verify_jwt = false
